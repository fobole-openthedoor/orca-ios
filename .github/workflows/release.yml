name: Release

# Publishes an unsigned IPA whenever the app's version has no release yet: on the default branch the
# tag is v<MARKETING_VERSION> from project.yml, on a pushed v* tag it is that tag.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.exists.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n "s/^ *MARKETING_VERSION: *'\{0,1\}\([^']*\)'\{0,1\} *$/\1/p" project.yml | head -1)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Look for an existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  ipa:
    name: Unsigned IPA
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-26
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build/DerivedData-release/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ hashFiles('project.yml', 'packages/OrcaCore/Package.swift') }}
          restore-keys: spm-release-${{ runner.os }}-
      - name: Build the IPA
        run: scripts/ipa.sh "$RUNNER_TEMP/Orca-iOS-$TAG-unsigned.ipa"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/Orca-iOS-${{ env.TAG }}-unsigned.ipa
          generate_release_notes: true
