name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  core:
    name: OrcaCore tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: packages/OrcaCore/.build
          key: orcacore-${{ runner.os }}-${{ hashFiles('packages/OrcaCore/Package.swift', 'packages/OrcaCore/Package.resolved') }}-${{ hashFiles('packages/OrcaCore/Sources/**', 'packages/OrcaCore/Tests/**') }}
          restore-keys: |
            orcacore-${{ runner.os }}-${{ hashFiles('packages/OrcaCore/Package.swift', 'packages/OrcaCore/Package.resolved') }}-
            orcacore-${{ runner.os }}-
      - name: swift test
        working-directory: packages/OrcaCore
        run: swift test

  app:
    name: Build the app
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen
      # Swift packages (Ghostty, MarkdownView, …) and the build products, so unchanged code isn't rebuilt.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            .build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'packages/OrcaCore/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Cache build products
        uses: actions/cache@v4
        with:
          path: |
            .build/DerivedData/Build
            .build/DerivedData/ModuleCache.noindex
          key: derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-
            derived-${{ runner.os }}-
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Orca.xcodeproj -scheme Orca -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | xcbeautify --renderer github-actions

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [gateway, gateway-worker]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npm test

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
